var P={lang:"ru",theme:"auto",size:0,best:0},qi=0,sc=0,tabI=0,ans=null;
function ld(){try{var s=JSON.parse(localStorage.getItem("bilim")||"{}");for(var k in s)P[k]=s[k]}catch(e){}}
function sv(){try{localStorage.setItem("bilim",JSON.stringify(P))}catch(e){}}
function $(s){return document.querySelectorAll(s)}
function apply(){
  var d=D[P.lang];document.documentElement.lang=P.lang;
  $("[data-i]").forEach(function(e){e.textContent=d[e.dataset.i]});
  document.title=d.title+" · Билим.kg";
  var r=document.documentElement;
  if(P.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",P.theme);
  r.style.fontSize=(100+P.size*12.5)+"%";
  $("#gl button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===P.lang)});
  $("#gt button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.th===P.theme)});
  $("#gs button").forEach(function(b){b.setAttribute("aria-pressed",+b.dataset.s===P.size)});
  $(".tabs button").forEach(function(b){b.setAttribute("aria-selected",+b.dataset.t===tabI)});
  document.getElementById("panel").textContent=d["pan"+tabI];
  quiz();
}
function quiz(){
  var d=D[P.lang],q=d.q,box=document.getElementById("quiz");
  document.getElementById("pb").style.width=(qi/q.length*100)+"%";
  box.textContent="";
  if(qi>=q.length){
    var h=document.createElement("p");h.className="fb";h.textContent=d.res+": "+sc+"/"+q.length+" · "+d.best+": "+P.best+"/"+q.length;
    var b=document.createElement("button");b.className="act";b.textContent=d.again;
    b.onclick=function(){ans=null;qi=0;sc=0;quiz()};box.append(h,b);return;
  }
  var c=q[qi],t=document.createElement("p");t.innerHTML="<b></b>";t.firstChild.textContent=d.qn+" "+(qi+1)+"/"+q.length+": "+c.t;
  var o=document.createElement("div");o.className="opts";
  var fb=document.createElement("p");fb.className="fb";
  var nx=document.createElement("button");nx.className="act";nx.textContent=d.next;nx.style.display="none";
  nx.onclick=function(){ans=null;qi++;if(qi>=q.length&&sc>P.best){P.best=sc;sv()}quiz()};
  c.o.forEach(function(x,i){
    var b=document.createElement("button");b.className="opt";b.textContent=x;
    b.onclick=function(){if(ans!==null)return;ans=i;if(i===c.a)sc++;quiz()};
    o.appendChild(b);
  });
  if(ans!==null){
    o.querySelectorAll("button").forEach(function(z,j){z.disabled=true;if(j===c.a)z.classList.add("good");else if(j===ans)z.classList.add("bad")});
    fb.textContent=ans===c.a?d.ok:d.no+c.o[c.a];nx.style.display="inline-block";
  }
  box.append(t,o,fb,nx);
}
$("#gl button").forEach(function(b){b.onclick=function(){P.lang=b.dataset.l;sv();apply()}});

ld();apply();
